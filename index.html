/* ---------- merged view of a client: Excel base + what was recorded here ---------- */
function card(id){return cards[id]||{}}
function view(c){const k=card(c.id),fu=c.fu&&c.fu.k!=='lead'?c.fu:null;return {
  wait:k.wait!==undefined?k.wait:(c.fu&&c.fu.k==='lead'?{lead:c.fu.w,since:c.fu.s,last:c.fu.s,n:c.fu.n||1,t:c.fu.t,imported:true}:null),
  lead:k.lead??c.lead, stage:k.stage??c.stage, dec:k.dec??c.dec,
  nextDate:k.nextDate!==undefined?k.nextDate:(fu?(fu.d||'2026-11-24'):null), nextWhy:k.nextDate!==undefined?(k.nextWhy||''):(fu?'מההערות באקסל: '+fu.t:''),
  frozen:k.frozenUntil&&k.frozenUntil>TODAY?k.frozenUntil:null, escalated:!!k.escalated, escNote:k.escNote||'',
  amit:k.amit||null, proposal:k.proposal||null, events:k.events||[], doneDay:k.doneDay||null, prev:k.prev||null}}
function lastTouch(c,v){const e=v.events;if(e.length)return e[e.length-1].ts.slice(0,10);return null}
function mine(c,v){return !isOut(c) && !v.amit && c.seg===USERS[who].seg && v.dec==='collect' && c.bal>=MIN_DEBT && !['legal'].includes(v.stage) && (who!=='yehuda'||!!v.lead)}

/* ---------- today's list: fixed for the day, computed from the state before today's work ---------- */
function todayList(){
  const items=[];
  for(const c of clients){const v=view(c); if(!mine(c,v))continue; if(v.wait&&v.doneDay!==TODAY)continue;
    const done=v.doneDay===TODAY;
    const b=done&&v.prev?{nextDate:v.prev.nextDate,nextWhy:v.prev.nextWhy,last:v.prev.last,frozen:v.prev.frozen}:{nextDate:v.nextDate,nextWhy:v.nextWhy,last:lastTouch(c,v),frozen:v.frozen};
    if(b.frozen&&!done)continue;
    let pr=3,why='';
    if(card(c.id).pin===TODAY&&!done){pr=1;why='הוחזר לרשימת המשימות'}
    else if(b.nextDate&&b.nextDate<=TODAY){pr=1;why=(b.nextWhy||'מעקב שנקבע')+(b.nextDate<TODAY?` (מועד: ${fmtD(b.nextDate)})`:'')}
    else if(b.nextDate){continue}
    else{const idle=b.last?daysBetween(b.last,TODAY):(c.notes.length?45:120);
      why=b.last?`לא טופל ${idle} ימים`:(c.notes.length?'הערה אחרונה מהאקסל: '+(n=>n.length>150?n.slice(0,150)+'…':n)(c.notes[c.notes.length-1]):'עדיין לא טופל בכלל');
      b.score=c.bal*(1+idle/30)}
    items.push({c,v,pr,why,score:b.score||c.bal,done})}
  const due=items.filter(i=>i.pr===1).sort((a,b)=>b.c.bal-a.c.bal);
  const fill=items.filter(i=>i.pr===3).sort((a,b)=>b.score-a.score).slice(0,Math.max(0,DAILY-due.length));
  return due.slice(0,DAILY).concat(fill)}

/* Jerusalem clients belong to Moti: hidden from Yehuda everywhere, totals included */
function pool(){return who==='yehuda'?clients.filter(c=>{const v=view(c);return !isOut(c)&&!!v.lead&&v.dec==='collect'&&v.stage!=='legal'}):clients.filter(c=>!isOut(c))}
function rHero(){
  const isM=who==='moti',sumOf=a=>a.reduce((s,c)=>s+c.bal,0);
  const lg=pool().filter(c=>{const v=view(c);return v.dec==='collect'&&v.stage==='legal'}),lgSum=sumOf(lg);
  const ng=pool().filter(c=>view(c).dec!=='collect'),jr=clients.filter(isOut);
  const tc=isM?pool().slice():pool().filter(c=>{const v=view(c);return v.dec==='collect'&&v.stage!=='legal'}),tt=tc.reduce((s,c)=>s+c.bal,0),old=tc.reduce((s,c)=>s+c.ag[6],0);
  const month=TODAY.slice(0,7),mName=new Intl.DateTimeFormat('he-IL',{month:'long'}).format(new Date());let paid=0,prom=0;
  for(const c of pool())for(const e of view(c).events){if(e.out==='paid'&&e.ts.slice(0,7)===month)paid+=e.amt||0;if(e.out==='promise'&&e.date&&e.date.slice(0,7)===month)prom+=e.amt||0}
  const g=settings.goal&&settings.goal.amount||0,left=Math.max(0,g-paid);
  const goal=g?`<div class="lbl">יעד הגבייה לחודש ${esc(mName)}</div><strong>${money(g)}</strong>

     <div class="gtxt">דווח כשולם: ${money(paid)} (${Math.round(paid/g*100)}%) · הובטח: ${money(prom)} · ${left?`חסר ליעד: ${money(left)}`:'היעד הושג'}</div>
     ${who==='moti'?'<button class="btn small" data-act="goal" style="margin-top:10px">שנה יעד</button>':''}`
   :`<div class="lbl">יעד הגבייה לחודש ${esc(mName)}</div><p class="gtxt" style="margin:6px 0 10px">עדיין לא נקבע יעד. ${who==='moti'?'אחרי שייקבע, תופיע כאן ההתקדמות אליו.':'מוטי קובע אותו מהלוח שלו.'}</p>${who==='moti'?'<button class="btn" data-act="goal">קבע יעד חודשי</button>':''}`;
  const h=$('#hero');h.innerHTML=`<div class="wrap"><div><div class="lbl">${isM?'סך כל החובות הפתוחים':'סך הכול לגבייה'} · ${tc.length} לקוחות</div><span class="big">${money(tt)}</span>

function taskHtml(i){const {c,v}=i;
  return `<article class="task${i.done?' done':''}" data-act="open" data-id="${esc(c.id)}" tabindex="0" title="לחיצה פותחת את תיק הלקוח">

      <div class="meta"><span>ראש צוות: ${esc(v.lead||'לא שויך')}</span>${c.ph&&c.ph.length?`<span class="num">${esc(c.ph[0][1])}</span>`:''}<span class="pill ${STAGE_TONE[v.stage]||''}">${STAGE[v.stage]}</span>${c.ag[6]>0?`<span>מעל 180 יום: ${money(c.ag[6])}</span>`:''}</div></div>

function splitPh(raw){raw=String(raw||'').trim();const m=raw.match(/\+?\d[\d\s\-]{5,}\d/);if(!m)return {num:raw,desc:'',tel:raw.replace(/[^\d+]/g,'')};
  const plus=m[0][0]==='+',dg=m[0].replace(/\D/g,'');let num=m[0].replace(/\s+/g,'');
  if(!plus&&dg[0]==='0'&&dg.length===10)num=dg.slice(0,3)+'-'+dg.slice(3);else if(!plus&&dg[0]==='0'&&dg.length===9)num=dg.slice(0,2)+'-'+dg.slice(2);else if(plus)num='+'+dg;
  const desc=(raw.slice(0,m.index)+' '+raw.slice(m.index+m[0].length)).replace(/[\s\-–—:,.;()]+/g,' ').trim();
  return {num,desc,tel:(plus?'+':'')+dg}}
function phonesHtml(c,big,mail){const ps=c.ph||[];if(!ps.length&&!mail)return '<span class="note">אין טלפון בעודכנית</span>';

async function doExport(how,btn){const er=m=>{const x=$('#exErr');if(x){x.textContent=m;x.hidden=false}},r=buildReport($('#exK').value);$('#exErr').hidden=true;
  if(how==='mail'){const to=$('#exTo').value.split(/[,;\s]+/).filter(Boolean);
    if(!to.length||to.some(a=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a)))return er('הקלד כתובת מייל תקינה אחת לפחות.');

    if(!dl)return er('הורדת קבצים אינה זמינה בתצוגה הזו, ולכן אי אפשר להכין את קובץ הדוח.');
    btn.disabled=true;let blob;try{blob=await makePdf(r)}catch(e){btn.disabled=false;return er('הכנת קובץ ה-PDF נכשלה. בדוק את החיבור לאינטרנט ונסה שוב.')}
    try{await dl.save({filename:r.file+'.pdf',data:blob})}catch(e){btn.disabled=false;return er(e&&e.code==='declined'?'הקובץ לא נשמר, ולכן לא הוכן מייל.':'שמירת הקובץ נכשלה.')}
    const body=`שלום,\n\nמצורף ${r.title}, נכון ל-${fmtD(TODAY)}.\n\n${r.kpis.map(k=>k[0]+': '+k[1]).join('\n')}\n\nבברכה,\n${USERS[who].name}`;let link='';
    try{const res=await mcp.callTool('Microsoft 365','outlook_create_draft',{to,subject:r.title+' · '+fmtD(TODAY),body,bodyType:'text'});const m=JSON.stringify(res).match(/https:\/\/[^"\\\s]*(?:outlook|office)[^"\\\s]*/i);if(m)link=m[0].replace(/\\u0026/g,'&')}
    catch(e){btn.disabled=false;return er('קובץ ה-PDF נשמר, אבל הטיוטה ב-Outlook לא נוצרה. ודא שהגישה ל-Microsoft 365 אושרה, או פתח מייל חדש וצרף את הקובץ.')}
    sheet(`<header><h2>המייל מוכן לשליחה</h2><button class="btn small" data-act="close">סגור</button></header>
     <ol style="margin:0 0 16px;padding-inline-start:22px;line-height:1.9"><li>קובץ ה-PDF של הדוח נשמר במחשב, בשם "${esc(r.file)}.pdf".</li><li>פתח את הטיוטה${link?'':' בתיקיית "טיוטות" ב-Outlook'}. הנמענים, הנושא והטקסט כבר בפנים.</li><li>צרף את קובץ ה-PDF ושלח.</li></ol>
     <div class="acts">${/^https:\/\//.test(link)?`<a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener">פתח את הטיוטה ב-Outlook</a>`:''}<button class="btn" data-act="close">סיימתי</button></div>`,true);return}
  if(!dl)return er('הורדת קבצים אינה זמינה בתצוגה הזו.');
  btn.disabled=true;let blob;
  try{blob=how==='xlsx'?await makeXlsx(r):await makePdf(r)}catch(e){btn.disabled=false;return er('הכנת הקובץ נכשלה. בדוק את החיבור לאינטרנט ונסה שוב.')}
  try{await dl.save({filename:r.file+(how==='xlsx'?'.xlsx':'.pdf'),data:blob});closeModal();toast('הקובץ נשמר.')}
  catch(e){btn.disabled=false;if(!e||e.code!=='declined')er('שמירת הקובץ נכשלה.')}}
/* global client search: part of a name or a client number, across every list */
const norm=s=>String(s||'').toLowerCase().replace(/["'״׳`\-–.,()]/g,'').replace(/\s+/g,' ').trim();
function gSearch(){const box=$('#gsRes'),q=norm($('#gs').value);if(!q){box.hidden=true;box.innerHTML='';return}
  const qd=q.replace(/\D/g,'');const hits=(who==='yehuda'?pool():clients).filter(c=>norm(c.name).includes(q)||c.id.includes(q)||(qd.length>=5&&(c.ph||[]).some(p=>p[1].replace(/\D/g,'').includes(qd)))).sort((a,b)=>(b.id===q)-(a.id===q)||(norm(b.name).startsWith(q))-(norm(a.name).startsWith(q))||b.bal-a.bal);
  box.innerHTML=hits.length?hits.slice(0,12).map(c=>{const v=view(c);return `<button type="button" data-act="open" data-id="${esc(c.id)}"><strong>${nm(c)}</strong><span class="amt">${money(c.bal)}</span><small>${v.dec==='collect'?STAGE[v.stage]:DEC[v.dec]}${v.lead?' · '+esc(v.lead):''}</small></button>`}).join('')+(hits.length>12?`<p>נמצאו ${hits.length} לקוחות. המשך להקליד כדי לצמצם.</p>`:''):'<p>לא נמצא לקוח מתאים.</p>';box.hidden=false}
$('#gs').addEventListener('input',gSearch);
$('#gs').addEventListener('focus',gSearch);
$('#gs').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('#gsRes button');if(b)b.click()}if(e.key==='Escape'){$('#gs').value='';gSearch()}});
document.addEventListener('click',e=>{if(e.target.closest('#gsRes button')){$('#gs').value='';gSearch();return}if(!e.target.closest('.gs'))$('#gsRes').hidden=true});
